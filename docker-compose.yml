# =============================================================
# Docker Compose — Development Infrastructure
# =============================================================
# Starts only PostgreSQL and Redis.
# Run API and frontend manually (IntelliJ, terminal, etc).
#
# Usage:
#   docker compose up -d          # Start postgres + redis
#   docker compose down            # Stop
#   docker compose down -v         # Stop and wipe data
#
# Then run locally:
#   cd apps/api  && ./mvnw spring-boot:run
#   cd apps/web  && npm run dev
# =============================================================

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sfp-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ffxiv_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ffxiv_planner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sfp-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
