sonar.projectKey=mineirinhodev_StaticForge
sonar.organization=mineirinhodev

# Sources
sonar.sources=apps/api/src/main/java,apps/web/src
sonar.tests=apps/api/src/test/java
sonar.java.binaries=apps/api/target/classes

# Coverage
sonar.java.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=apps/api/target/site/jacoco/jacoco.xml

# Exclusions
sonar.exclusions=**/node_modules/**,**/.next/**,**/target/**,**/build/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

# Encoding
sonar.sourceEncoding=UTF-8

# Java
sonar.java.source=21
