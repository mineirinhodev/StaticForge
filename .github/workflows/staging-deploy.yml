# =============================================================
# Staging Deploy — build & deploy to self-hosted machine
# =============================================================
# Triggers on push to master (after PR merge).
# 1. Validates backend compilation on GitHub runners
# 2. Deploys directly on your machine via self-hosted runner
#
# Setup (one-time):
#   1. GitHub → Settings → Actions → Runners → New self-hosted runner
#   2. Follow the install instructions for Windows
#   3. Install as a Windows service so it starts automatically
#   4. Make sure Docker Desktop is running on the machine
#   5. Create a .env file in the repo root (copy from .env.example)
# =============================================================

name: Staging Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  # ── Quick validation (runs on GitHub) ──────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile backend
        working-directory: apps/api
        run: |
          chmod +x ./mvnw
          ./mvnw compile -B

  # ── Deploy on your machine (self-hosted runner) ────────
  deploy:
    name: Deploy to Local Machine
    runs-on: self-hosted
    needs: validate
    timeout-minutes: 20

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4

      - name: Verify .env exists
        shell: bash
        run: |
          if [ ! -f .env ]; then
            echo "❌ ERROR: .env file not found!"
            echo "Copy .env.example to .env and fill in the required values:"
            echo "  POSTGRES_PASSWORD, JWT_SECRET, REDIS_PASSWORD"
            exit 1
          fi
          echo "✅ .env file found"

      - name: Verify Docker is running
        shell: bash
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "❌ ERROR: Docker is not running!"
            echo "Start Docker Desktop and try again."
            exit 1
          fi
          echo "✅ Docker is running"

      - name: Stop existing containers
        shell: bash
        run: docker compose -f docker-compose.prod.yml down --remove-orphans || true

      - name: Build and start all services
        shell: bash
        run: docker compose -f docker-compose.prod.yml up --build -d

      - name: Wait for services to be healthy
        shell: bash
        run: |
          echo "Waiting for services to start..."
          sleep 15

          echo ""
          echo "========================================="
          echo "  Service Status:"
          echo "========================================="
          docker compose -f docker-compose.prod.yml ps
          echo ""

          # Check each service
          FAILED=0

          if docker compose -f docker-compose.prod.yml ps postgres | grep -q "healthy"; then
            echo "✅ PostgreSQL: healthy"
          else
            echo "⚠️  PostgreSQL: starting (may need more time)"
          fi

          if docker compose -f docker-compose.prod.yml ps redis | grep -q "healthy"; then
            echo "✅ Redis: healthy"
          else
            echo "⚠️  Redis: starting (may need more time)"
          fi

          if docker compose -f docker-compose.prod.yml ps api | grep -q "Up"; then
            echo "✅ API: running"
          else
            echo "❌ API: not running"
            FAILED=1
          fi

          if docker compose -f docker-compose.prod.yml ps web | grep -q "Up"; then
            echo "✅ Web: running"
          else
            echo "❌ Web: not running"
            FAILED=1
          fi

          if docker compose -f docker-compose.prod.yml ps nginx | grep -q "Up"; then
            echo "✅ Nginx: running"
          else
            echo "❌ Nginx: not running"
            FAILED=1
          fi

          echo ""
          if [ $FAILED -eq 0 ]; then
            echo "========================================="
            echo "  ✅ Deploy complete!"
            echo "  Access: http://localhost"
            echo "========================================="
          else
            echo "========================================="
            echo "  ⚠️  Some services may still be starting."
            echo "  Check with: docker compose -f docker-compose.prod.yml ps"
            echo "  Logs: docker compose -f docker-compose.prod.yml logs -f"
            echo "========================================="
          fi

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: |
          echo "========================================="
          echo "  Last 50 lines of logs:"
          echo "========================================="
          docker compose -f docker-compose.prod.yml logs --tail 50
