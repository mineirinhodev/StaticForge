# =============================================================
# Staging Deploy — build Docker images & push to GHCR
# =============================================================
# Triggers on push to master (after PR merge).
# Builds api, web, and nginx images and pushes to ghcr.io.
# =============================================================

name: Staging Deploy

on:
  push:
    branches: [master]

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/staticforge

jobs:
  # ── Quick validation before building images ─────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Compile backend
        working-directory: apps/api
        run: ./mvnw compile -B

  # ── Build & push Docker images ─────────────────────────
  build-api:
    name: Build API image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws

  build-nginx:
    name: Build Nginx image
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to staging (placeholder) ────────────────────
  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-api, build-web, build-nginx]
    timeout-minutes: 10
    environment: staging

    steps:
      - name: Deploy placeholder
        run: |
          echo "========================================="
          echo "  Staging images built and pushed:"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:staging-latest"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:staging-latest"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:staging-latest"
          echo "========================================="
          echo ""
          echo "To deploy manually via SSH:"
          echo "  ssh user@staging-server 'cd /app && docker compose pull && docker compose up -d'"
          echo ""
          echo "Or configure one of these deployment methods:"
          echo "  - SSH: appleboy/ssh-action@v1"
          echo "  - AWS ECS: aws-actions/amazon-ecs-deploy-task-definition@v2"
          echo "  - DigitalOcean: digitalocean/action-doctl@v2"
