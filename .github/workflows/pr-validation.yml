# =============================================================
# PR Validation — lint, test, build
# =============================================================
# Runs on every pull request targeting master.
# Three parallel jobs + a gate job that requires all to pass.
# =============================================================

name: PR Validation

on:
  pull_request:
    branches: [master]
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── Frontend: lint + type-check + build ──────────────────
  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Security audit
        run: npm audit --production --audit-level=high || true

      - name: Lint frontend
        run: npx turbo run lint --filter=@ffxiv-planner/web

      - name: Build frontend
        run: npx turbo run build --filter=@ffxiv-planner/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws

  # ── Backend: compile + test (with real PostgreSQL + Redis) ──
  backend-test:
    name: Backend (test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ffxiv_planner_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ffxiv_planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Run tests
        working-directory: apps/api
        run: |
          chmod +x ./mvnw
          ./mvnw verify -B -Dspring.profiles.active=ci
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/ffxiv_planner_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-characters-long

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: apps/api/target/surefire-reports/
          retention-days: 7

  # ── Backend: build JAR (no tests) ───────────────────────
  backend-build:
    name: Backend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build JAR
        working-directory: apps/api
        run: |
          chmod +x ./mvnw
          ./mvnw package -DskipTests -B

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: apps/api/target/*.jar
          retention-days: 1

  # ── Gate: all jobs must pass ────────────────────────────
  gate:
    name: PR Gate
    runs-on: ubuntu-latest
    needs: [frontend, backend-test, backend-build]
    if: always()

    steps:
      - name: Check results
        run: |
          if [[ "${{ needs.frontend.result }}" != "success" ]]; then
            echo "❌ Frontend job failed"
            exit 1
          fi
          if [[ "${{ needs.backend-test.result }}" != "success" ]]; then
            echo "❌ Backend test job failed"
            exit 1
          fi
          if [[ "${{ needs.backend-build.result }}" != "success" ]]; then
            echo "❌ Backend build job failed"
            exit 1
          fi
          echo "✅ All jobs passed"
