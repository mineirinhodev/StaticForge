# =============================================================
# Production Deploy — validate, deploy & release
# =============================================================
# Triggers on:
#   - Tag push: v*.*.* (e.g., v1.0.0, v1.2.3-rc.1)
#   - Manual dispatch (with optional skip-tests for emergencies)
#
# Flow: validate (GitHub) → deploy (self-hosted) → release (GitHub)
#
# Requires self-hosted runner on your machine.
# See staging-deploy.yml header for setup instructions.
# =============================================================

name: Production Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency hotfix only)"
        required: false
        default: "false"
        type: boolean
      tag:
        description: "Version tag (e.g., v1.2.3). If empty, uses latest commit SHA."
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ── Validate (runs on GitHub, skippable for emergencies) ──
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ffxiv_planner_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ffxiv_planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci || npm install --no-audit

      - name: Lint frontend
        run: npx turbo run lint --filter=@ffxiv-planner/web

      - name: Build frontend
        run: npx turbo run build --filter=@ffxiv-planner/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws

      - name: Run backend tests
        working-directory: apps/api
        run: |
          chmod +x ./mvnw
          ./mvnw verify -B -Dspring.profiles.active=ci
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/ffxiv_planner_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-characters-long

  # ── Compute version tag ─────────────────────────────────
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_release: ${{ steps.tag.outputs.is_release }}

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: ${TAG}"

  # ── Deploy on your machine (self-hosted runner) ────────
  deploy:
    name: Deploy to Production
    runs-on: self-hosted
    needs: [validate, version]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    timeout-minutes: 20
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .env exists
        shell: bash
        run: |
          if [ ! -f .env ]; then
            echo "❌ ERROR: .env file not found!"
            echo "Copy .env.example to .env and fill in the required values."
            exit 1
          fi
          echo "✅ .env file found"

      - name: Verify Docker is running
        shell: bash
        run: |
          if ! docker info > /dev/null 2>&1; then
            echo "❌ ERROR: Docker is not running!"
            echo "Start Docker Desktop and try again."
            exit 1
          fi
          echo "✅ Docker is running"

      - name: Stop existing containers
        shell: bash
        run: docker compose -f docker-compose.prod.yml down --remove-orphans || true

      - name: Build and start all services
        shell: bash
        run: docker compose -f docker-compose.prod.yml up --build -d

      - name: Wait and verify deployment
        shell: bash
        run: |
          echo "Waiting for services to start..."
          sleep 20

          echo ""
          echo "========================================="
          echo "  Production Deploy: ${{ needs.version.outputs.tag }}"
          echo "========================================="
          docker compose -f docker-compose.prod.yml ps
          echo ""

          FAILED=0

          if docker compose -f docker-compose.prod.yml ps postgres | grep -q "healthy"; then
            echo "✅ PostgreSQL: healthy"
          else
            echo "⚠️  PostgreSQL: starting"
          fi

          if docker compose -f docker-compose.prod.yml ps redis | grep -q "healthy"; then
            echo "✅ Redis: healthy"
          else
            echo "⚠️  Redis: starting"
          fi

          for svc in api web nginx; do
            if docker compose -f docker-compose.prod.yml ps $svc | grep -q "Up"; then
              echo "✅ $svc: running"
            else
              echo "❌ $svc: not running"
              FAILED=1
            fi
          done

          echo ""
          if [ $FAILED -eq 0 ]; then
            echo "✅ Production deploy complete! → http://localhost"
          else
            echo "⚠️  Some services may still be starting."
            echo "Check: docker compose -f docker-compose.prod.yml logs -f"
          fi

      - name: Show logs on failure
        if: failure()
        shell: bash
        run: docker compose -f docker-compose.prod.yml logs --tail 50

  # ── Create GitHub Release (only for version tags) ──────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, deploy]
    if: needs.version.outputs.is_release == 'true'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline ${PREV_TAG}..HEAD --no-merges)
          else
            COMMITS=$(git log --oneline HEAD~10..HEAD --no-merges)
          fi

          cat > /tmp/release-notes.md << NOTES_EOF
          ## Version ${{ needs.version.outputs.tag }}

          ## Changes

          NOTES_EOF

          echo "$COMMITS" | while read -r line; do
            echo "- $line" >> /tmp/release-notes.md
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-rc') || contains(needs.version.outputs.tag, '-beta') || contains(needs.version.outputs.tag, '-alpha') }}
