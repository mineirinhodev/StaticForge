# =============================================================
# Production Deploy — build versioned images & release
# =============================================================
# Triggers on:
#   - Tag push: v*.*.* (e.g., v1.0.0, v1.2.3-rc.1)
#   - Manual dispatch (with optional skip-tests for emergencies)
#
# Flow: validate → build 3 images → deploy (with approval) → release
# =============================================================

name: Production Deploy

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip tests (emergency hotfix only)"
        required: false
        default: "false"
        type: boolean
      tag:
        description: "Version tag (e.g., v1.2.3). If empty, uses latest commit SHA."
        required: false
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/staticforge

jobs:
  # ── Validate (skippable for emergency hotfixes) ────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ffxiv_planner_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ffxiv_planner_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --health-start-period 10s

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci || npm install --no-audit

      - name: Lint frontend
        run: npx turbo run lint --filter=@ffxiv-planner/web

      - name: Build frontend
        run: npx turbo run build --filter=@ffxiv-planner/web
        env:
          NEXT_PUBLIC_API_URL: /api/v1
          NEXT_PUBLIC_WS_URL: /ws

      - name: Run backend tests
        working-directory: apps/api
        run: |
          chmod +x ./mvnw
          ./mvnw verify -B -Dspring.profiles.active=ci
        env:
          DATABASE_URL: jdbc:postgresql://localhost:5432/ffxiv_planner_test
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-jwt-secret-key-minimum-32-characters-long

  # ── Compute version tag ─────────────────────────────────
  version:
    name: Compute version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      is_release: ${{ steps.tag.outputs.is_release }}

    steps:
      - name: Determine tag
        id: tag
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            TAG="${{ github.ref_name }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.tag }}" ]]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          else
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-7)"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Resolved tag: ${TAG}"

  # ── Build & push production Docker images ──────────────
  build-api:
    name: Build API image (prod)
    runs-on: ubuntu-latest
    needs: [validate, version]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-web:
    name: Build Web image (prod)
    runs-on: ubuntu-latest
    needs: [validate, version]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=/api/v1
            NEXT_PUBLIC_WS_URL=/ws

  build-nginx:
    name: Build Nginx image (prod)
    runs-on: ubuntu-latest
    needs: [validate, version]
    if: always() && (needs.validate.result == 'success' || needs.validate.result == 'skipped')
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Nginx image
        uses: docker/build-push-action@v6
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:${{ needs.version.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Deploy to production (requires environment approval) ──
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [version, build-api, build-web, build-nginx]
    timeout-minutes: 10
    environment: production

    steps:
      - name: Deploy placeholder
        run: |
          echo "========================================="
          echo "  Production images (${{ needs.version.outputs.tag }}):"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-api:${{ needs.version.outputs.tag }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-web:${{ needs.version.outputs.tag }}"
          echo "  - ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-nginx:${{ needs.version.outputs.tag }}"
          echo "========================================="
          echo ""
          echo "To deploy manually via SSH:"
          echo "  ssh user@prod-server 'cd /app && docker compose pull && docker compose up -d'"

  # ── Create GitHub Release (only for version tags) ──────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [version, deploy]
    if: needs.version.outputs.is_release == 'true'
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        run: |
          # Get commits since last tag
          PREV_TAG=$(git tag --sort=-version:refname | head -2 | tail -1)
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline ${PREV_TAG}..HEAD --no-merges)
          else
            COMMITS=$(git log --oneline HEAD~10..HEAD --no-merges)
          fi

          # Write to file for multi-line output
          cat > /tmp/release-notes.md << 'NOTES_EOF'
          ## Docker Images

          ```
          ghcr.io/${{ env.IMAGE_PREFIX }}-api:${{ needs.version.outputs.tag }}
          ghcr.io/${{ env.IMAGE_PREFIX }}-web:${{ needs.version.outputs.tag }}
          ghcr.io/${{ env.IMAGE_PREFIX }}-nginx:${{ needs.version.outputs.tag }}
          ```

          ## Changes

          NOTES_EOF

          echo "$COMMITS" | while read -r line; do
            echo "- $line" >> /tmp/release-notes.md
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: ${{ contains(needs.version.outputs.tag, '-rc') || contains(needs.version.outputs.tag, '-beta') || contains(needs.version.outputs.tag, '-alpha') }}
