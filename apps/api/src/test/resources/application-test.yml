# =============================================================
# Spring Profile: Test (local development)
# =============================================================
# Used by: ./mvnw test (default when no profile specified)
#
# Uses H2 in-memory database with PostgreSQL compatibility mode.
# No external services required (no Docker needed to run tests).
# =============================================================

spring:
  datasource:
    url: jdbc:h2:mem:ffxiv_planner_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: false

  # Disable Redis in local tests — use simple (in-memory) cache
  data:
    redis:
      host: ""
      port: 0

  cache:
    type: simple

  # Disable mail in tests
  mail:
    host: ""

# Deterministic JWT secret for tests
app:
  frontend-url: http://localhost:3000
  jwt:
    secret: test-jwt-secret-key-minimum-32-characters-long-for-hs256
  stripe:
    secret-key: sk_test_placeholder
    webhook-secret: whsec_test_placeholder
    price-monthly: price_monthly_test
    price-annual: price_annual_test

logging:
  level:
    root: WARN
    com.ffxiv.planner: DEBUG
    org.hibernate.SQL: WARN
