spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ffxiv_planner}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jpa:
    show-sql: true

# Restrict actuator even in development
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    env:
      enabled: false
    beans:
      enabled: false
    configprops:
      enabled: false

logging:
  level:
    org.springframework.security: WARN
    org.hibernate.SQL: DEBUG
