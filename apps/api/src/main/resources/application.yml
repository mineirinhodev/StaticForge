spring:
  application:
    name: ffxiv-planner-api

  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      # Reject unknown JSON fields to prevent mass-assignment attacks.
      # All accepted fields must be explicitly declared in request DTOs.
      fail-on-unknown-properties: true

  cache:
    type: redis

server:
  port: 8080
  servlet:
    context-path: /api/v1

logging:
  level:
    root: INFO
    com.ffxiv.planner: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    access-expiration: 15m
    refresh-expiration: 30d
