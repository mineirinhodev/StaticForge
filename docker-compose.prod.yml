# =============================================================
# Docker Compose — Production
# =============================================================
# Builds and runs the full stack using production Dockerfiles.
# All HTTP traffic enters via Nginx on port 80.
#
# Required environment variables (.env file):
#   POSTGRES_PASSWORD   — strong password for PostgreSQL
#   JWT_SECRET          — min 32 characters for HS256 signing
#   REDIS_PASSWORD      — password for Redis authentication
#
# Usage:
#   docker compose -f docker-compose.prod.yml up --build
#   docker compose -f docker-compose.prod.yml down
# =============================================================

services:
  # ── PostgreSQL ──────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sfp-postgres
    # Internal only — no host port mapping in production.
    # For admin access, use: docker exec -it sfp-postgres psql -U postgres
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ffxiv_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ffxiv_planner}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Redis ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sfp-redis
    # Internal only — no host port mapping in production.
    # For admin access, use: docker exec -it sfp-redis redis-cli -a $REDIS_PASSWORD
    expose:
      - "6379"
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --rename-command FLUSHALL ""
      --rename-command FLUSHDB ""
      --rename-command DEBUG ""
      --rename-command CONFIG ""
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ── Spring Boot API ─────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: sfp-api
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-ffxiv_planner}
      DATABASE_USERNAME: ${POSTGRES_USER:-postgres}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ── Next.js Frontend ────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: sfp-web
    expose:
      - "3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-/ws}
    depends_on:
      - api
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 256M

  # ── Nginx Reverse Proxy ────────────────────
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: sfp-nginx
    ports:
      - "80:8080"
      # Uncomment for SSL:
      # - "443:8443"
    # Uncomment to mount SSL certs:
    # volumes:
    #   - /etc/letsencrypt/live/yourdomain:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:uid=101,gid=101
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

volumes:
  pgdata:
  redisdata:
