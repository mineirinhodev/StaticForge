# =============================================================
# Nginx Reverse Proxy — FFXIV Static Planner (Production)
# =============================================================
# Runs as non-root user (nginx). Listens on unprivileged port
# 8080 internally; docker-compose maps host port 80 → 8080.
# SSL termination is optional — see the commented HTTPS block.
# =============================================================

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /tmp/nginx.pid;

# Override default temp paths to use tmpfs-backed /var/cache/nginx
# (required for read-only root filesystem with non-root user)
client_body_temp_path /var/cache/nginx/client_temp;
proxy_temp_path       /var/cache/nginx/proxy_temp;
fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
scgi_temp_path        /var/cache/nginx/scgi_temp;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide Nginx version in response headers and error pages
    server_tokens off;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ── Trusted proxy — only trust Docker internal networks ──
    # This ensures $remote_addr reflects the real client IP,
    # not a spoofed X-Forwarded-For header.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # ── Rate limiting zones ─────────────────────────────
    # General: 10 requests/second per IP (burst up to 20)
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    # Auth endpoints: stricter — 5 requests/second per IP (burst up to 10)
    limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/s;
    # API-wide: 30 requests/second per IP (burst up to 60)
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # Return 429 Too Many Requests (not 503)
    limit_req_status 429;

    # ── Gzip compression ────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/font-woff2;

    # ── Global request size limit ───────────────────────
    client_max_body_size 1m;

    # ── Buffer settings to prevent proxy buffer overflow attacks ──
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;
    large_client_header_buffers 4 16k;

    # ── Upstream definitions — match Docker Compose service names ──
    upstream frontend {
        server web:3000;
    }

    upstream backend {
        server api:8080;
    }

    # ── HTTP server (default — unprivileged port for non-root) ──
    server {
        listen 8080;
        server_name _;

        # ── Security headers ────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;" always;

        # Block requests with suspicious User-Agent or no User-Agent
        if ($http_user_agent = "") {
            return 444;
        }

        # Block common vulnerability scanners
        if ($request_uri ~* "(\.env|\.git|wp-admin|phpinfo|phpmyadmin)") {
            return 444;
        }

        # ── Frontend (Next.js) ──────────────────────────
        location / {
            limit_req zone=general burst=20 nodelay;

            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Auth endpoints (strict rate limit) ──────────
        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            client_max_body_size 64k;
        }

        # ── Stripe webhook (no rate limit — Stripe controls flow) ──
        location /api/v1/webhooks/stripe {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Stripe can send large payloads
            client_max_body_size 1m;
        }

        # ── Backend API (general) ───────────────────────
        location /api/ {
            limit_req zone=api burst=60 nodelay;

            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Allow file uploads (avatars, etc.)
            client_max_body_size 10m;
        }

        # ── WebSocket (STOMP over SockJS) ───────────────
        location /ws/ {
            limit_req zone=general burst=10 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Keep WebSocket connections alive (24h)
            proxy_read_timeout 86400;
            proxy_send_timeout 86400;
        }

        # ── Actuator endpoints (restricted to internal networks) ──
        location /actuator/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;

            # Only allow Docker internal networks
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 127.0.0.1;
            deny all;
        }

        # ── Block dotfiles and common exploit paths ─────
        location ~ /\. {
            deny all;
            return 404;
        }
    }

    # ── HTTPS server (optional) ───────────────────────────
    # To enable SSL:
    # 1. Uncomment the server block below
    # 2. Mount certificates via Docker volume in docker-compose.prod.yml:
    #      volumes:
    #        - /etc/letsencrypt/live/yourdomain:/etc/nginx/certs:ro
    # 3. Expose port 443 in docker-compose.prod.yml:
    #      ports:
    #        - "80:8080"
    #        - "443:8443"
    # 4. Replace "ffxiv-planner.com" with your actual domain
    #
    # server {
    #     listen 8443 ssl http2;
    #     server_name ffxiv-planner.com;
    #
    #     # ── TLS configuration (Mozilla Modern) ──────
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols       TLSv1.2 TLSv1.3;
    #     ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     ssl_session_cache   shared:SSL:10m;
    #     ssl_session_timeout 1d;
    #     ssl_session_tickets off;
    #
    #     # OCSP stapling
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #     ssl_trusted_certificate /etc/nginx/certs/chain.pem;
    #     resolver 8.8.8.8 8.8.4.4 valid=300s;
    #     resolver_timeout 5s;
    #
    #     # HSTS (2 years, includeSubDomains, preload-ready)
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # Same security headers and location blocks as the HTTP server above.
    #     # Copy them here when enabling HTTPS.
    # }
    #
    # # Redirect HTTP → HTTPS
    # server {
    #     listen 8080;
    #     server_name ffxiv-planner.com;
    #     return 301 https://$host$request_uri;
    # }
}
